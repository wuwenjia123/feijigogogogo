<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>飞机大战 - CYBER FIGHTER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20">
  <!-- ============================================================
       ✅ 【内嵌兜底CSS】防止 style.css 加载失败时出现你现在的白屏：
       - Netlify/任何托管把 .css 返回了 404 或 HTML（SPA fallback误配）
       - 用户缓存、CDN、?v=xx 版本号冲突
       只要这里内嵌的最小样式在，就算外面 style.css 挂了游戏照样能玩
       ============================================================ -->
  <style data-role="critical-fallback">
    /* ===== 基础重置 & 深色背景（防白屏关键） ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0a0a1a;  /* 兜底深色背景，白屏时至少是黑的 */
      color: #ffffff; font-family: 'Rajdhani', 'Orbitron', sans-serif;
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    }
    /* ===== 全屏容器 & 画布（防看不到游戏画面） ===== */
    #game-container {
      position: relative; width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #0d0d2b 0%, #050510 100%);
      overflow: hidden;
    }
    #game-canvas {
      display: block; background: #050510;
      box-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
      border: 1px solid #00f0ff; border-radius: 4px;
    }
    /* ===== 屏幕：hidden 必生效（防所有screen同时显示） ===== */
    .screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      z-index: 100; background: rgba(5, 5, 16, 0.92);
      backdrop-filter: blur(8px);
    }
    .hidden { display: none !important; }   /* ← 最关键的一行，你的问题就是这个类没生效 */
    /* ===== 菜单内容居中 ===== */
    .menu-content { text-align: center; padding: 40px; max-width: 480px; width: 90%; }
    .game-title {
      font-family: 'Orbitron', sans-serif; font-size: clamp(32px, 8vw, 64px);
      font-weight: 900; letter-spacing: 4px; color: #00f0ff;
      text-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff, 0 0 40px #00f0ff;
      margin-bottom: 10px;
    }
    .game-subtitle {
      font-size: clamp(16px, 4vw, 22px); color: #bf00ff;
      text-shadow: 0 0 8px #bf00ff; letter-spacing: 3px; margin-bottom: 30px;
    }
    /* ===== 按钮样式（让它们看起来像按钮，不是一行文字） ===== */
    .menu-btn {
      position: relative; padding: 12px 28px; min-width: 160px; font-size: 16px;
      font-weight: 700; letter-spacing: 2px; color: #ffffff;
      background: linear-gradient(135deg, #1a1a3a 0%, #2a2a5a 100%);
      border: 2px solid #00f0ff; border-radius: 4px; cursor: pointer;
      transition: all 0.2s ease; overflow: hidden; margin: 4px;
    }
    .menu-btn:hover, .menu-btn:active {
      background: linear-gradient(135deg, #00f0ff 0%, #00a0c8 100%);
      color: #050510; box-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff; transform: translateY(-2px);
    }
    .menu-buttons { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .screen-title {
      font-family: 'Orbitron', sans-serif; font-size: 36px; font-weight: 900;
      letter-spacing: 4px; color: #ff0066; text-shadow: 0 0 10px #ff0066, 0 0 20px #ff0066;
      margin-bottom: 24px;
    }
    /* ===== 顶部 HUD 不让文字堆叠到一起 ===== */
    #hud { position: absolute; top: 0; left: 0; width: 100%; padding: 12px 20px; z-index: 50; pointer-events: none; }
    .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .hud-left { display: flex; flex-direction: column; gap: 8px; }
    .hud-center { text-align: center; }
    .hud-right { text-align: right; display: flex; flex-direction: column; gap: 6px; }
    .hud-score-label { font-size: 12px; color: #a0a0c0; letter-spacing: 3px; }
    .hud-score { font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 700; color: #00f0ff; }
    .hud-level { font-family: 'Orbitron', sans-serif; font-size: 14px; color: #ffcc00; letter-spacing: 2px; }
    .hud-bottom { position: absolute; bottom: 12px; left: 20px; right: 20px; display: flex; align-items: center; gap: 16px; }
    .weapon-name { font-size: 14px; color: #00ff88; font-weight: 700; letter-spacing: 2px; }
    .weapon-level { font-size: 12px; color: #a0a0c0; }
    .energy-bar { width: 200px; height: 10px; background: #1a1a3a; border: 1px solid #00f0ff; border-radius: 5px; overflow: hidden; }
    .energy-fill { height: 100%; background: linear-gradient(90deg, #00f0ff, #bf00ff); transition: width 0.2s; }
    .energy-label { font-size: 10px; color: #a0a0c0; letter-spacing: 2px; margin-top: 2px; }
    #boss-hp-container { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); width: 60%; max-width: 400px; z-index: 60; text-align: center; }
    .boss-name { font-size: 14px; color: #ff0066; font-weight: 700; letter-spacing: 3px; margin-bottom: 4px; }
    .boss-hp-bar { height: 12px; background: #1a1a3a; border: 2px solid #ff0066; border-radius: 6px; overflow: hidden; box-shadow: 0 0 10px rgba(255,0,102,.5); }
    .boss-hp-fill { height: 100%; background: linear-gradient(90deg, #ff0066, #ff6699); transition: width 0.2s; }
    /* ===== 其他文字元素：分数/关卡/credit 不会错位 ===== */
    .high-score { text-align: center; margin: 20px 0; font-size: 18px; color: #ffcc00; }
    .high-score .label { color: #a0a0c0; font-size: 14px; letter-spacing: 2px; display: block; margin-bottom: 4px; }
    #game-banner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 200; }
    .banner-inner { padding: 10px 20px; border-radius: 4px; font-weight: 700; letter-spacing: 2px; }
    .banner-debug .banner-inner { background: rgba(0,240,255,.15); border: 2px solid #00f0ff; color: #00f0ff; }
    .banner-warn .banner-inner { background: rgba(255,204,0,.15); border: 2px solid #ffcc00; color: #ffcc00; }
    .banner-err .banner-inner { background: rgba(255,0,102,.15); border: 2px solid #ff0066; color: #ff0066; }
    /* ===== stats 面板不让文字堆 ===== */
    .stats-panel { text-align: center; margin: 20px 0; }
    .stat-row { display: flex; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid #3a3a6a; }
    .stat-label { color: #a0a0c0; }
    .stat-value { color: #00f0ff; font-weight: 700; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-left">
          <div class="hud-lives" id="hud-lives"></div>
          <div class="hud-bombs" id="hud-bombs"></div>
        </div>
        <div class="hud-center">
          <div class="hud-score-label">SCORE</div>
          <div class="hud-score" id="hud-score">0</div>
        </div>
        <div class="hud-right">
          <div class="hud-level" id="hud-level">STAGE 1</div>
          <div class="hud-combo" id="hud-combo"></div>
        </div>
      </div>
      
      <div class="hud-bottom">
        <div class="hud-weapon">
          <div class="weapon-name" id="weapon-name">LASER</div>
          <div class="weapon-level" id="weapon-level">Lv.1</div>
        </div>
        <div class="hud-energy">
          <div class="energy-bar">
            <div class="energy-fill" id="energy-fill"></div>
          </div>
          <div class="energy-label">ENERGY</div>
        </div>
      </div>
      
      <div id="boss-hp-container" class="hidden">
        <div class="boss-name" id="boss-name">BOSS</div>
        <div class="boss-hp-bar">
          <div class="boss-hp-fill" id="boss-hp-fill"></div>
        </div>
      </div>
    </div>
    
    <div id="menu-screen" class="screen">
      <div class="menu-content">
        <h1 class="game-title glitch" data-text="CYBER FIGHTER">
          <span>CYBER</span>
          <span class="title-accent">FIGHTER</span>
        </h1>
        <p class="game-subtitle">飞 机 大 战</p>
        
        <div class="menu-buttons">
          <button class="menu-btn primary" data-action="start">
            <span class="btn-icon">▶</span>
            <span class="btn-text">开始游戏</span>
          </button>
          <button class="menu-btn" data-action="levelSelect">
            <span class="btn-icon">📋</span>
            <span class="btn-text">关卡选择</span>
          </button>
          <button class="menu-btn" data-action="shop">
            <span class="btn-icon">🛒</span>
            <span class="btn-text">武器商店</span>
          </button>
          <button class="menu-btn" data-action="settings">
            <span class="btn-icon">⚙</span>
            <span class="btn-text">游戏设置</span>
          </button>
          <button class="menu-btn" data-action="testGogogo">
            <span class="btn-icon">🎵</span>
            <span class="btn-text">试听 出发喽 音效</span>
          </button>
        </div>
        
        <div class="high-score-display">
          <div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
            <div><span class="hs-label">HIGH SCORE</span>
            <span class="hs-value" id="menu-high-score">0</span></div>
            <div><span class="hs-label" style="color: #ffcc00;">CREDITS</span>
            <span class="hs-value" id="menu-credits" style="color: #ffcc00;">0</span></div>
          </div>
        </div>
      </div>
      
      <div class="scanlines"></div>
    </div>
    
    <div id="pause-screen" class="screen hidden">
      <div class="menu-content">
        <h2 class="screen-title">PAUSED</h2>
        <div class="menu-buttons">
          <button class="menu-btn primary" data-action="resume">
            <span class="btn-icon">▶</span>
            <span class="btn-text">继续游戏</span>
          </button>
          <button class="menu-btn" data-action="restart">
            <span class="btn-icon">↻</span>
            <span class="btn-text">重新开始</span>
          </button>
          <button class="menu-btn" data-action="menu">
            <span class="btn-icon">🏠</span>
            <span class="btn-text">返回主菜单</span>
          </button>
        </div>
      </div>
    </div>
    
    <div id="gameover-screen" class="screen hidden">
      <div class="menu-content">
        <h2 class="screen-title game-over-title">GAME OVER</h2>
        <div class="result-stats">
          <div class="stat-row">
            <span class="stat-label">最终分数</span>
            <span class="stat-value" id="final-score">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">最高连击</span>
            <span class="stat-value" id="final-combo">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">击毁敌机</span>
            <span class="stat-value" id="final-kills">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">历史最高</span>
            <span class="stat-value" id="final-high-score">0</span>
          </div>
          <div class="stat-row rating-row">
            <span class="stat-label">评级</span>
            <span class="stat-value rating" id="final-rating">-</span>
          </div>
        </div>
        <div class="menu-buttons">
          <button class="menu-btn primary" data-action="restart">
            <span class="btn-icon">↻</span>
            <span class="btn-text">再玩一次</span>
          </button>
          <button class="menu-btn" data-action="menu">
            <span class="btn-icon">🏠</span>
            <span class="btn-text">返回主菜单</span>
          </button>
        </div>
      </div>
    </div>
    
    <div id="victory-screen" class="screen hidden">
      <div class="menu-content">
        <h2 class="screen-title victory-title">STAGE CLEAR!</h2>
        <div class="result-stats">
          <div class="stat-row">
            <span class="stat-label">最终分数</span>
            <span class="stat-value" id="victory-score">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">最高连击</span>
            <span class="stat-value" id="victory-combo">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">击毁敌机</span>
            <span class="stat-value" id="victory-kills">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">用时</span>
            <span class="stat-value" id="victory-time">00:00</span>
          </div>
          <div class="stat-row rating-row">
            <span class="stat-label">评级</span>
            <span class="stat-value rating" id="victory-rating">-</span>
          </div>
        </div>
        <div class="menu-buttons">
          <button class="menu-btn primary" data-action="nextLevel">
            <span class="btn-icon">▶</span>
            <span class="btn-text">下一关</span>
          </button>
          <button class="menu-btn" data-action="restart">
            <span class="btn-icon">↻</span>
            <span class="btn-text">重玩本关</span>
          </button>
          <button class="menu-btn" data-action="menu">
            <span class="btn-icon">🏠</span>
            <span class="btn-text">返回主菜单</span>
          </button>
        </div>
      </div>
    </div>
    
    <div id="level-select-screen" class="screen hidden">
      <div class="menu-content">
        <h2 class="screen-title">SELECT STAGE</h2>
        <div class="level-grid" id="level-grid"></div>
        <div class="menu-buttons">
          <button class="menu-btn" data-action="menu">
            <span class="btn-icon">←</span>
            <span class="btn-text">返回</span>
          </button>
        </div>
      </div>
    </div>
    
    <div id="settings-screen" class="screen hidden">
      <div class="menu-content">
        <h2 class="screen-title">SETTINGS</h2>
        <div class="settings-group">
          <div class="setting-item">
            <span class="setting-label">难度</span>
            <div class="setting-options" id="difficulty-options">
              <button class="option-btn" data-value="EASY">简单</button>
              <button class="option-btn active" data-value="NORMAL">普通</button>
              <button class="option-btn" data-value="HARD">困难</button>
            </div>
          </div>
          <div class="setting-item">
            <span class="setting-label">背景音乐</span>
            <div class="setting-slider">
              <input type="range" id="bgm-volume" min="0" max="100" value="70">
              <span class="slider-value" id="bgm-value">70%</span>
            </div>
          </div>
          <div class="setting-item">
            <span class="setting-label">音效</span>
            <div class="setting-slider">
              <input type="range" id="sfx-volume" min="0" max="100" value="88">
              <span class="slider-value" id="sfx-value">88%</span>
            </div>
          </div>
          <div class="setting-item">
            <span class="setting-label">显示FPS</span>
            <div class="setting-toggle">
              <label class="toggle-switch">
                <input type="checkbox" id="show-fps">
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>
        </div>
        <div class="menu-buttons">
          <button class="menu-btn primary" data-action="menu">
            <span class="btn-icon">✓</span>
            <span class="btn-text">确定</span>
          </button>
        </div>
      </div>
    </div>
    
    <div id="shop-screen" class="screen hidden">
      <div class="menu-content shop-content">
        <h2 class="screen-title">🛒 武器商店</h2>
        <div class="shop-header">
          <div class="shop-credits">
            <span class="credits-label">💰 积分</span>
            <span class="credits-value" id="shop-credits">0</span>
          </div>
          <div class="shop-tabs">
            <button class="shop-tab active" data-tab="weapons">武器</button>
            <button class="shop-tab" data-tab="ships">战舰</button>
          </div>
        </div>
        <div class="shop-list" id="shop-list"></div>
        <div class="shop-footer">
          <div class="shop-hint" id="shop-hint">选择武器或战舰进行购买/装备</div>
          <button class="menu-btn" data-action="menu">
            <span class="btn-icon">←</span>
            <span class="btn-text">返回</span>
          </button>
        </div>
      </div>
    </div>
    
    <div id="warning-overlay" class="hidden">
      <div class="warning-text">⚠ WARNING ⚠</div>
    </div>

    <div id="game-banner" class="hidden">
      <div class="banner-inner">
        <div class="banner-text" id="game-banner-text">出发喽</div>
      </div>
    </div>
    
    <div id="fps-display" class="hidden">FPS: 60</div>
  </div>
  
  <script src="js/utils.js?v=20"></script>
  <script src="js/input.js?v=20"></script>
  <script src="js/audio.js?v=20"></script>
  <script src="js/particle.js?v=20"></script>
  <script src="js/bullet.js?v=20"></script>
  <script src="js/powerup.js?v=20"></script>
  <script src="js/player.js?v=20"></script>
  <script src="js/shop.js?v=20"></script>
  <script src="js/enemy.js?v=20"></script>
  <script src="js/boss.js?v=20"></script>
  <script src="js/collision.js?v=20"></script>
  <script src="js/level.js?v=20"></script>
  <script src="js/renderer.js?v=20"></script>
  <script src="js/ui.js?v=20"></script>
  <script src="js/game.js?v=20"></script>
  <script src="js/main.js?v=20"></script>
</body>
</html>
